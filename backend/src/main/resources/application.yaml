spring:
  application:
    name: game-server-manager

server:
  address: ${GAME_SERVER_MANAGER_ADDRESS:127.0.0.1}
  port: ${GAME_SERVER_MANAGER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${GAME_SERVER_MANAGER_SECURE_COOKIE:false}

game-server-manager:
  storage:
    root: "${GAME_SERVER_MANAGER_ROOT:C:\\GameServerManager}"
