spring:
  application:
    name: game-server-manager

server:
  address: ${GAME_SERVER_MANAGER_ADDRESS:127.0.0.1}
  port: ${GAME_SERVER_MANAGER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${GAME_SERVER_MANAGER_SECURE_COOKIE:false}

game-server-manager:
  open-browser: ${GAME_SERVER_MANAGER_OPEN_BROWSER:false}
  features:
    demo-enabled: ${GAME_SERVER_MANAGER_DEMO_ENABLED:true}
  storage:
    root: "${GAME_SERVER_MANAGER_ROOT:${LOCALAPPDATA:${user.home}/AppData/Local}/GameServerManager}"
